apiVersion: v1
kind: Service
metadata:
  name: {{ include "qfieldcloud.fullname" . }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.worker.executionMode "docker" }}
  type: NodePort
  {{- else }}
  type: {{ .Values.service.type }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if eq .Values.worker.executionMode "docker" }}
      nodePort: {{ .Values.worker.docker.qfieldcloudNodePort }}
      {{- end }}
  selector:
    {{- include "qfieldcloud.selectorLabels" . | nindent 4 }} 