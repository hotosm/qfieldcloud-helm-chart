{{/* Generated rather than defaulted, so installs do not share a published key. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qfieldcloud.djangoSecretName" . }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ .Values.django.settings.secretKey | default (include "qfieldcloud.retainedSecret" (dict "ctx" . "key" "secret-key" "default" (randAlphaNum 50))) | b64enc | quote }}
  salt-key: {{ .Values.django.settings.saltKey | default (include "qfieldcloud.retainedSecret" (dict "ctx" . "key" "salt-key" "default" (randAlphaNum 50))) | b64enc | quote }}
  {{- if .Values.django.superuser.enabled }}
  superuser-password: {{ .Values.django.superuser.password | default (include "qfieldcloud.retainedSecret" (dict "ctx" . "key" "superuser-password" "default" (randAlphaNum 24))) | b64enc | quote }}
  {{- end }}
{{- if include "qfieldcloud.database.createSecret" . }}
---
{{/* External database only; otherwise the subchart or the user owns it. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qfieldcloud.fullname" . }}-database
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "database.password is required when postgresql.enabled is false and database.existingSecret is not set" .Values.database.password | b64enc | quote }}
{{- end }}
