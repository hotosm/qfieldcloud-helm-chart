{{- if .Values.memcached.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qfieldcloud.fullname" . }}-memcached
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "qfieldcloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: memcached
  template:
    metadata:
      labels:
        {{- include "qfieldcloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: memcached
    spec:
      containers:
        - name: memcached
          image: {{ include "qfieldcloud.image" (dict "ctx" . "image" .Values.memcached.image) | quote }}
          imagePullPolicy: {{ .Values.memcached.image.pullPolicy }}
          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.memcached.resources | nindent 12 }}
---
{{/* Must match the hardcoded "memcached:11211" in settings.py; ignore_exc means a wrong name silently disables caching. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.memcached.serviceName }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
spec:
  type: ClusterIP
  ports:
    - port: 11211
      targetPort: memcached
      protocol: TCP
      name: memcached
  selector:
    {{- include "qfieldcloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
{{- end }}
