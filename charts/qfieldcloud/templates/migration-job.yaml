apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "qfieldcloud.fullname" . }}-migrate
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 5

  template:
    metadata:
      labels:
        {{- include "qfieldcloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migrate
          image: {{ include "qfieldcloud.image" (dict "ctx" . "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - /bin/bash
            - -c
            - |
              set -e
              python manage.py migrate --noinput
              {{- if .Values.django.superuser.enabled }}
              # Exits non-zero if the account exists, so stay idempotent.
              python manage.py createsuperuser --noinput \
                || echo "superuser {{ .Values.django.superuser.username }} already exists, skipping"
              {{- end }}

          env:
            {{- include "qfieldcloud.djangoEnv" . | nindent 12 }}
