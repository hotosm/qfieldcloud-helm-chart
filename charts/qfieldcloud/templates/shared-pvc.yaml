{{/* Scratch space shared between the workers and the QGIS Jobs they spawn. */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qfieldcloud.sharedPvcName" . }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.shared.accessMode }}
  {{- if .Values.persistence.shared.storageClass }}
  storageClassName: {{ .Values.persistence.shared.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.shared.size | quote }}
