# Default values for qfieldcloud
replicaCount: 1

# Empty tags default to .Chart.AppVersion, pinning app/worker/cron/QGIS together.
image:
  repository: opengisch/qfieldcloud-app
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

django:
  gunicorn:
    timeout: 120
    maxRequests: 1000
    workers: 4
    threads: 2
  settings:
    debug: 0
    environment: production
    # Leave empty to generate a random value, retained across upgrades.
    secretKey: ""
    # Encrypted-model-field key: changing it makes existing encrypted values undecryptable.
    # Set explicitly when adopting this chart on a database that already has data.
    saltKey: ""
    # "*" is required for kubelet probes, which address pods by IP.
    allowedHosts: "*"
    settingsModule: "qfieldcloud.settings"
    accountEmailVerification: "mandatory"
    useXForwardedHost: "0"
    useI18n: 1
    defaultLanguage: "en"
    defaultTimeZone: "UTC"
    authTokenExpirationHours: 24
    subscriptionModel: "subscription.Subscription"

  # Created by the migration job, idempotently.
  superuser:
    enabled: false
    username: "admin"
    email: ""
    # Empty generates one: kubectl get secret <release>-django -o jsonpath='{.data.superuser-password}' | base64 -d
    password: ""

  sentry:
    dsn: ""
    release: ""
    sampleRate: 0.1

  storage:
    projectDefaultStorage: "default"
    minioApiPort: 8009
    minioBrowserPort: 8010
    # Passed to Django verbatim as STORAGES; reaches containers as a plain env var
    # visible in `kubectl describe pod`, so use a least-privilege bucket user.
    storagesConfig:
      default:
        BACKEND: "qfieldcloud.filestorage.backend.QfcS3Boto3Storage"
        OPTIONS:
          access_key: "rustfsadmin"
          secret_key: "rustfsadmin"
          bucket_name: "qfieldcloud-local"
          region_name: "us-east-1"
          endpoint_url: "http://qfieldcloud-rustfs-svc:9000"
          custom_domain: null
          file_overwrite: false
          object_parameters: {}
          default_acl: "private"
        QFC_IS_LEGACY: false

# Used only when postgresql.enabled is false, where these become required.
database:
  host: ""
  port: 5432
  name: "qfieldcloud"
  user: "qfieldcloud"
  password: ""
  existingSecret: ""
  existingSecretKey: "password"
  sslMode: "prefer"

qgis:
  image:
    repository: opengisch/qfieldcloud-qgis
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: opengisch/qfieldcloud-app
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env: {}

memcached:
  enabled: true
  # qfieldcloud hardcodes "memcached:11211" with no env override, so the Service
  # must use this exact name; only one release per namespace can own it.
  serviceName: memcached
  image:
    repository: memcached
    tag: "1.6-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

cronJobs:
  enabled: true
  image:
    repository: opengisch/qfieldcloud-app
    tag: ""
    pullPolicy: IfNotPresent
  schedule: "@every 1m"
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Everything except `enabled` passes through to the container spec. Liveness is TCP
# on purpose: /api/v1/status/ hits the database, so a blip would restart-loop pods.
livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  enabled: true
  httpGet:
    path: /api/v1/status/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  enabled: false
  httpGet:
    path: /api/v1/status/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  # Shared with the QGIS jobs workers spawn; ReadWriteOnce confines them to one node.
  shared:
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    mountPath: /io
  transformationGrids:
    # When false, an emptyDir is used and grids re-download on restart.
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    downloadOnStartup: true
    sourceUrl: "https://cdn.proj.org/"
    image:
      repository: alpine
      tag: "3.22"
      pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

# Disable when using external S3, and repoint storagesConfig.
rustfs:
  enabled: true
  replicaCount: 1

  storageclass:
    name: standard
    dataStorageSize: 1Gi
    logStorageSize: 1Gi

  config:
    rustfs:
      volumes: "/data"

# Development only: Bitnami publishes no versioned tags, so this pulls `latest` and a
# restart can land on a major that rejects the data dir. In production use database.*.
postgresql:
  enabled: true

  auth:
    username: qfieldcloud
    database: qfieldcloud
    # Empty means the subchart generates one and retains it across upgrades.
    password: ""
    existingSecret: ""

  primary:
    persistence:
      enabled: false

# Applied to every process. Rendered through `tpl`, so use template expressions
# for anything release-dependent rather than hardcoding names.
env:
  QFIELDCLOUD_ACCOUNT_ADAPTER: "qfieldcloud.core.adapters.AccountAdapterSignUpClosed"

  # CHANGE ME: the public hostname clients connect to.
  QFIELDCLOUD_HOST: qfield.field.localhost
  CORS_ALLOWED_ORIGINS: "http://qfield.field.localhost,http://qfield.field.localhost:7050"
  CORS_ALLOW_CREDENTIALS: 1

  QFIELDCLOUD_WORKER_QFIELDCLOUD_URL: 'http://{{ include "qfieldcloud.fullname" . }}:8000/api/v1/'
  QFIELDCLOUD_QGIS3_IMAGE_NAME: 'opengisch/qfieldcloud-qgis:{{ .Values.qgis.image.tag | default .Chart.AppVersion }}'
  QFIELDCLOUD_QGIS4_IMAGE_NAME: 'opengisch/qfieldcloud-qgis:{{ .Values.qgis.image.tag | default .Chart.AppVersion }}'

  QFC_K8S_NAMESPACE: '{{ .Release.Namespace }}'
  QFC_K8S_JOB_BACKOFF_LIMIT: "0"
  QFC_K8S_JOB_TIMEOUT_SECONDS: "3600"
  QFC_K8S_CPU_REQUEST: "500m"
  QFC_K8S_CPU_LIMIT: "1000m"
  QFC_K8S_MEMORY_REQUEST: "512Mi"
  QFC_K8S_MEMORY_LIMIT: "1Gi"
  QFC_SHARED_PVC_NAME: '{{ include "qfieldcloud.sharedPvcName" . }}'
  QFC_SHARED_DIR: '{{ .Values.persistence.shared.mountPath }}'
  QFIELDCLOUD_TRANSFORMATION_GRIDS_VOLUME_NAME: 'transformation-grids-{{ include "qfieldcloud.fullname" . }}-worker-0'

  COMPOSE_PROJECT_NAME: qfieldcloud
  QFIELDCLOUD_PASSWORD_LOGIN_IS_ENABLED: 1
  QFIELDCLOUD_ADMIN_URI: admin/

  EMAIL_HOST: mail
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  EMAIL_PORT: 1025
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: noreply@field.localhost
