# Default values for qfieldcloud
replicaCount: 1

image:
  repository: opengisch/qfieldcloud-app
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Django application configuration
django:
  gunicorn:
    timeout: 120
    maxRequests: 1000
    workers: 4
    threads: 2
  settings:
    debug: 1
    environment: production
    secretKey: ""  # Should be provided via secret
    allowedHosts: "*"
    settingsModule: "qfieldcloud.settings"
    accountEmailVerification: "mandatory"
    useI18n: 1
    defaultLanguage: "en"
    defaultTimeZone: "UTC"
    authTokenExpirationHours: 24
    passwordLoginDisabled: false
    subscriptionModel: "free"
    workerQfieldcloudUrl: "http://app:8000/api/v1/"  # URL used by worker to communicate with the main app
  sentry:
    dsn: ""
    release: ""
    sampleRate: 0.1
  email:
    host: ""
    useTls: true
    useSsl: false
    port: 587
    hostUser: ""
    hostPassword: ""  # Should be provided via secret
    defaultFromEmail: "noreply@example.com"
  storage:
    type: "s3"  # local, s3, etc.
    accessKeyId: "minioadmin"  # Default from env.example
    secretAccessKey: "minioadmin"  # Default from env.example
    bucketName: "qfieldcloud-local"  # Default from env.example
    regionName: ""  # Empty by default as in env.example
    endpointUrl: "http://172.17.0.1:8009"  # Default from env.example
    projectDefaultStorage: "default"  # Should match the storage backend name in STORAGES
    minioApiPort: 8009  # Default from env.example
    minioBrowserPort: 8010  # Default from env.example
    storagesConfig:
      default:
        BACKEND: "qfieldcloud.filestorage.backend.QfcS3Boto3Storage"
        OPTIONS:
          access_key: "minioadmin"
          secret_key: "minioadmin"
          bucket_name: "qfieldcloud-local"
          region_name: ""
          endpoint_url: "http://172.17.0.1:8009"
          custom_domain: null
          file_overwrite: false
          object_parameters: {}
          default_acl: "private"
        QFC_IS_LEGACY: false

# Database configuration
database:
  # External database configuration
  external: true
  host: ""
  port: 5432
  name: "qfieldcloud"
  user: "qfieldcloud"
  password: ""  # Should be provided via secret
  sslMode: "prefer"

# Geodatabase configuration
geodatabase:
  # External geodatabase configuration
  external: true
  host: ""
  port: 5432
  name: "qfieldcloud_geodb"
  user: "qfieldcloud"
  password: ""  # Should be provided via secret

# QGIS configuration
qgis:
  image:
    repository: opengisch/qfieldcloud-qgis
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  transformationGrids:
    # If true, will download transformation grids as an init container
    downloadOnStartup: true
    # URL to download transformation grids from
    sourceUrl: "https://cdn.proj.org/"

# Worker configuration
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: opengisch/qfieldcloud-app
    tag: latest
    pullPolicy: IfNotPresent
    target: worker_wrapper_runtime  # Use the worker wrapper runtime that includes Docker client
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    #QFIELDCLOUD_HOST: "http://qfieldcloud"
    #SALT_KEY: "test123"
    DJANGO_USE_X_FORWARDED_HOST: "0"

# Memcached configuration
memcached:
  enabled: true
  image:
    repository: memcached
    tag: "1"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Cron jobs configuration
cronJobs:
  enabled: true
  image:
    repository: opengisch/qfieldcloud-app
    tag: latest
    pullPolicy: IfNotPresent
  schedule: "@every 1m"
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Ingress configuration
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Resource configuration
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Pod configuration
nodeSelector: {}
tolerations: []
affinity: {}

# Persistent volume configuration
persistence:
  transformationGrids:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""  # Use default storage class if empty

serviceAccount:
  create: true
  name: "" 

rustfs:
  replicaCount: 1

  storageclass:
    name: standard
    dataStorageSize: 1Gi
    logStorageSize: 1Gi

  config:
    rustfs:
      volumes: "/data"

env:
  QFIELDCLOUD_ACCOUNT_ADAPTER: "qfieldcloud.core.adapters.AccountAdapterSignUpOpen"
  QFIELDCLOUD_HOST: qfield.field.localhost
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_EMAIL: sysadmin@hotosm.org
  DJANGO_SUPERUSER_PASSWORD: ${QFIELDCLOUD_ADMIN_PASSWORD}
  QFIELDCLOUD_WORKER_QFIELDCLOUD_URL: "http://app:8000/api/v1/"
  SALT_KEY: 0123456789abcdefghijklmnopqrstuvwxyz
  COMPOSE_PROJECT_NAME: qfieldcloud
  QFIELDCLOUD_TRANSFORMATION_GRIDS_VOLUME_NAME: ${COMPOSE_PROJECT_NAME}_qfield_transformation_grids
  EMAIL_HOST: mail
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  EMAIL_PORT: 1025
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: noreply@field.localhost
  #SECRET_KEY: YKuuTCb256dMmcg4DxpxrCafrcVvk8s3ZJrtDr9JaVAkeLiULGiemyzUTQESrzPQhiYUfn

  QFIELDCLOUD_PASSWORD_LOGIN_IS_ENABLED: 1
  QFIELDCLOUD_ADMIN_URI: admin/
  CORS_ALLOWED_ORIGINS: "http://qfield.field.localhost,http://qfield.field.localhost:7050"
  CORS_ALLOW_CREDENTIALS: 1
